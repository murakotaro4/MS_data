name: approve data CI

on:
  workflow_run:
    workflows:
      - ci
    types:
      - completed
  workflow_dispatch:
    inputs:
      run_id:
        description: CI run ID awaiting approval
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read
  actions: read

jobs:
  evaluate:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'action_required'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      eligible: ${{ steps.target.outputs.eligible }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          persist-credentials: false
      - uses: ./.github/actions/setup-uv-env
      - id: target
        name: Check eligibility without mutations
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_RUN_ID: ${{ inputs.run_id || github.event.workflow_run.id }}
        run: |
          uv run python -m ms_data.gh.auto_ci_approval \
            --repo "$GITHUB_REPOSITORY" \
            --run-id "$TARGET_RUN_ID" \
            --check-only --github-output "$GITHUB_OUTPUT"
  approve:
    needs: evaluate
    if: needs.evaluate.outputs.eligible == 'true'
    permissions:
      contents: read
      pull-requests: read
      actions: write
    concurrency:
      group: msdata-auto-review-merge
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # 特権実行ではPRブランチをcheckoutしない。
      - uses: actions/checkout@v6
        with:
          ref: main
          persist-credentials: false
      - uses: ./.github/actions/setup-uv-env
      - name: Validate data PR and approve its CI
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_RUN_ID: ${{ inputs.run_id || github.event.workflow_run.id }}
        run: |
          uv run python -m ms_data.gh.auto_ci_approval \
            --repo "$GITHUB_REPOSITORY" \
            --run-id "$TARGET_RUN_ID"
