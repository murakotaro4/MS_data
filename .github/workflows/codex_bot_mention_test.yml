name: codex bot mention test

# bot 名義（github-actions[bot]）の「@codex review」に Codex が応答するかを確認する一時ワークフロー。
# 検証完了後に削除する。

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: "メンションを投稿する PR 番号"
        required: true

permissions:
  contents: read

jobs:
  post-mention:
    permissions:
      pull-requests: write
      issues: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Post @codex review as github-actions bot
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          set -euo pipefail
          gh pr comment "${PR_NUMBER}" --repo "${GITHUB_REPOSITORY}" --body "@codex review"
