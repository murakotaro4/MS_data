name: data update

on:
  schedule:
    - cron: "0 9 * * 2,4" # JST 18:00 (Tue/Thu)
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Tokyo
      TTL: 7d
      RATE: 1.0
      LIMIT: 0
      ARTIFACT_RETENTION_DAYS: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install deps
        run: uv sync --dev

      - name: Prepare
        run: |
          report_date="$(date +%Y%m%d)"
          echo "REPORT_DATE=${report_date}" >> "$GITHUB_ENV"
          echo "PROVENANCE_FILE=reports/provenance_${report_date}.json" >> "$GITHUB_ENV"
          echo "RAW_ARTIFACT_NAME=raw-snapshot-${report_date}-run-${GITHUB_RUN_ID}" >> "$GITHUB_ENV"
          echo "RAW_SNAPSHOT_FILE=raw_snapshot_${report_date}_run${GITHUB_RUN_ID}.tar.xz" >> "$GITHUB_ENV"

      - name: Fetch and import
        run: |
          cp msData.json msData.before.json
          mkdir -p reports
          make scrape-index TTL="${TTL}"
          make scrape-details TTL="${TTL}" RATE="${RATE}" LIMIT="${LIMIT}"
          make import-details
          make validate-strict
          uv run python -m scripts.report_msdata_diff \
            --old msData.before.json \
            --new msData.json \
            --out "reports/diff_msdata_${REPORT_DATE}.md" \
            --print-summary | tee reports/diff_summary.txt
          uv run python -m scripts.generate_provenance \
            --date "${REPORT_DATE}" \
            --index cache/index.json \
            --details-jsonl cache/details.jsonl \
            --details-json cache/details.json \
            --msdata msData.json \
            --diff "reports/diff_msdata_${REPORT_DATE}.md" \
            --html-dir cache/html \
            --out "${PROVENANCE_FILE}" \
            --ttl "${TTL}" \
            --rate "${RATE}" \
            --limit "${LIMIT}" \
            --artifact-name "${RAW_ARTIFACT_NAME}" \
            --artifact-retention-days "${ARTIFACT_RETENTION_DAYS}"
          XZ_OPT=-9e tar -cJf "${RAW_SNAPSHOT_FILE}" \
            cache/html \
            cache/index.json \
            cache/details.jsonl \
            cache/details.json \
            "reports/diff_msdata_${REPORT_DATE}.md" \
            "${PROVENANCE_FILE}"
          rm -f msData.before.json

      - id: summary
        name: Read summary
        run: |
          echo "summary=$(cat reports/diff_summary.txt)" >> "$GITHUB_OUTPUT"

      - id: changes
        name: Check changes
        run: |
          if [ -n "$(git diff --name-only -- msData.json reports)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload raw snapshot artifact
        if: steps.changes.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.RAW_ARTIFACT_NAME }}
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}
          if-no-files-found: error
          path: |
            ${{ env.RAW_SNAPSHOT_FILE }}
            reports/diff_msdata_${{ env.REPORT_DATE }}.md
            reports/provenance_${{ env.REPORT_DATE }}.json

      - name: Create pull request
        if: steps.changes.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "data: msData.json を更新（${{ env.REPORT_DATE }}; ${{ steps.summary.outputs.summary }}）"
          title: "data: msData.json を更新（${{ env.REPORT_DATE }}）"
          body: |
            自動更新（定期実行）により差分を作成しました。
            - 差分: ${{ steps.summary.outputs.summary }}
            - レポート: reports/diff_msdata_${{ env.REPORT_DATE }}.md
            - provenance: reports/provenance_${{ env.REPORT_DATE }}.json
            - source_run_id: ${{ github.run_id }}
            - source_artifact: ${{ env.RAW_ARTIFACT_NAME }}
            <!-- source_run_id:${{ github.run_id }} -->
          branch: "data/auto-update-${{ env.REPORT_DATE }}"
          add-paths: |
            msData.json
            reports/*.md
            reports/provenance_${{ env.REPORT_DATE }}.json
