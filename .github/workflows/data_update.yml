name: data update

on:
  schedule:
    - cron: "0 9 * * 1-6" # JST 18:00 (Mon-Sat fast update)
    - cron: "0 9 * * 0" # JST 18:00 (Sunday full update)
  workflow_dispatch:
    inputs:
      force_full:
        description: "Force full scrape instead of fast-path diff detection"
        required: false
        default: false
        type: boolean
      dry_run:
        description: "Run update checks and upload reports without creating a PR"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  update:
    permissions:
      actions: read
      contents: write
      pull-requests: write
      issues: write
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Tokyo
      TTL: 1h
      RATE: 2.0
      LIMIT: 0
      ARTIFACT_RETENTION_DAYS: 90
      ATWIKI_QUALITY_MAX_FAILURE_RATE: ${{ vars.ATWIKI_QUALITY_MAX_FAILURE_RATE || '0.10' }}
      ATWIKI_QUALITY_MIN_DETAIL_RECORD_RATIO: ${{ vars.ATWIKI_QUALITY_MIN_DETAIL_RECORD_RATIO || '0.80' }}
      ATWIKI_QUALITY_FULL_DIFF_WARNING_COUNT: ${{ vars.ATWIKI_QUALITY_FULL_DIFF_WARNING_COUNT || '200' }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true

      - name: Install deps
        run: uv sync --dev

      - name: Prepare
        run: |
          report_date="$(date +%Y%m%d)"
          dry_run="false"
          full_update="false"
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ github.event.inputs.dry_run }}" == "true" ]]; then
            dry_run="true"
          fi
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ github.event.inputs.force_full }}" == "true" ]]; then
            full_update="true"
          fi
          if [[ "${{ github.event_name }}" == "schedule" && "${{ github.event.schedule }}" == "0 9 * * 0" ]]; then
            full_update="true"
          fi
          echo "REPORT_DATE=${report_date}" >> "$GITHUB_ENV"
          echo "HEAD_REF=data/auto-update-${report_date}" >> "$GITHUB_ENV"
          echo "DRY_RUN=${dry_run}" >> "$GITHUB_ENV"
          echo "FULL_UPDATE=${full_update}" >> "$GITHUB_ENV"
          echo "PROVENANCE_FILE=reports/provenance_${report_date}.json" >> "$GITHUB_ENV"
          echo "RAW_ARTIFACT_NAME=raw-snapshot-${report_date}-run-${GITHUB_RUN_ID}" >> "$GITHUB_ENV"
          echo "RAW_SNAPSHOT_FILE=raw_snapshot_${report_date}_run${GITHUB_RUN_ID}.tar.xz" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=raw-snapshot-${report_date}-run-${GITHUB_RUN_ID}" >> "$GITHUB_ENV"

      - name: Validate report contract (naming)
        run: |
          uv run python -m ms_data.validation.validate_report_contract \
            --mode data-update \
            --manifest reports_manifest.yml \
            --report-date "${REPORT_DATE}" \
            --source-run-id "${GITHUB_RUN_ID}" \
            --head-ref "${HEAD_REF}" \
            --diff-path "reports/diff_msdata_${REPORT_DATE}.md" \
            --provenance-path "${PROVENANCE_FILE}" \
            --artifact-name "${RAW_ARTIFACT_NAME}" \
            --snapshot-file "${RAW_SNAPSHOT_FILE}" \
            --release-tag "${RELEASE_TAG}"

      - name: Validate official overrides schema
        run: uv run python -m ms_data.tasks validate-official-overrides-schema

      - name: Restore previous detect state
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .detect_state
          mkdir -p .detect_state

          previous_run_id="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/data_update.yml/runs?status=success&event=schedule&per_page=10" --jq '.workflow_runs[0].id // empty' 2>/dev/null || true)"
          if [[ -n "${previous_run_id}" ]]; then
            gh run download "${previous_run_id}" \
              --repo "${GITHUB_REPOSITORY}" \
              --name detect-state \
              --dir .detect_state >/dev/null 2>&1 || true
          fi

          if [[ -f ".detect_state/cache/index_changed_meta.json" ]]; then
            echo "PREVIOUS_PROVENANCE=.detect_state/cache/index_changed_meta.json" >> "$GITHUB_ENV"
          elif [[ -f ".detect_state/index_changed_meta.json" ]]; then
            echo "PREVIOUS_PROVENANCE=.detect_state/index_changed_meta.json" >> "$GITHUB_ENV"
          fi

          if [[ -f ".detect_state/cache/detail_fetch_state.json" ]]; then
            mkdir -p cache
            cp ".detect_state/cache/detail_fetch_state.json" "cache/detail_fetch_state.json"
          elif [[ -f ".detect_state/detail_fetch_state.json" ]]; then
            mkdir -p cache
            cp ".detect_state/detail_fetch_state.json" "cache/detail_fetch_state.json"
          fi

      - name: Fetch and import
        run: |
          cp msData.json msData.before.json
          mkdir -p reports
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ github.event.inputs.force_full }}" == "true" ]]; then
            export FORCE_FULL=1
            export FORCE=1
          fi
          if [[ "${{ github.event_name }}" == "schedule" && "${{ github.event.schedule }}" == "0 9 * * 0" ]]; then
            export FORCE_FULL=1
            export FORCE=1
          fi
          OFFICIAL_OVERRIDE_RAW_OUT=cache/msData.before_official_overrides.json \
          FAST_TTL="${TTL}" RATE="${RATE}" LIMIT="${LIMIT}" MSDATA=msData.json \
            uv run python -m ms_data.tasks update-fast

      - name: Run rollback guard
        run: |
          mkdir -p reports
          uv run python -m ms_data.audit.detect_msdata_rollbacks \
            --old msData.before.json \
            --new msData.json \
            --out "reports/rollback_guard_${REPORT_DATE}.md"

      - id: official_overrides_audit
        name: Run official override audit
        run: |
          mkdir -p reports
          uv run python -m ms_data.audit.audit_official_overrides \
            --before msData.before.json \
            --raw cache/msData.before_official_overrides.json \
            --current msData.json \
            --out "reports/official_overrides_audit_${REPORT_DATE}.md" \
            --today "${REPORT_DATE}" \
            --github-output "$GITHUB_OUTPUT" \
            --step-summary "$GITHUB_STEP_SUMMARY"

      - name: Notify official override due issue
        if: env.DRY_RUN != 'true' && steps.official_overrides_audit.outputs.protected_rollback == '0' && steps.official_overrides_audit.outputs.due_count != '' && steps.official_overrides_audit.outputs.due_count != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create official-overrides \
            --repo "${GITHUB_REPOSITORY}" \
            --description "Touches official override audit path" \
            --color "5319E7" \
            --force
          gh label create override-due \
            --repo "${GITHUB_REPOSITORY}" \
            --description "official_overrides review/remove date reached" \
            --color "B60205" \
            --force

          body_path="$RUNNER_TEMP/official_overrides_due.md"
          cat > "$body_path" <<EOF
          official_overrides の期限確認が必要です。

          - report_date: ${REPORT_DATE}
          - review_due: ${{ steps.official_overrides_audit.outputs.review_due }}
          - remove_due: ${{ steps.official_overrides_audit.outputs.remove_due }}
          - audit_report: reports/official_overrides_audit_${REPORT_DATE}.md
          - workflow_run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}

          remove_due が 1 件以上ある場合は、該当 override を撤去できるか確認してください。
          EOF

          issue_number="$(gh issue list \
            --repo "${GITHUB_REPOSITORY}" \
            --state open \
            --search "official_overrides 期限確認 in:title" \
            --json number \
            --jq '.[0].number // ""')"
          if [[ -n "${issue_number}" ]]; then
            gh issue comment "${issue_number}" --repo "${GITHUB_REPOSITORY}" --body-file "$body_path"
          else
            gh issue create \
              --repo "${GITHUB_REPOSITORY}" \
              --title "official_overrides 期限確認" \
              --body-file "$body_path" \
              --label official-overrides \
              --label override-due
          fi

      - id: detection
        name: Read change detection summary
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          meta = json.loads(Path("cache/index_changed_meta.json").read_text(encoding="utf-8"))
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write(f"candidate_count={int(meta.get('candidate_count', 0))}\n")
              f.write(f"fast_path={str(bool(meta.get('fast_path', False))).lower()}\n")
              f.write(f"age_coverage={meta.get('age_coverage', 0.0)}\n")
              f.write(f"fallback_reason={meta.get('fallback_reason') or 'none'}\n")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as f:
              f.write("### Change Detection\n")
              f.write(f"- candidate_count: {int(meta.get('candidate_count', 0))}\n")
              f.write(f"- fast_path: {str(bool(meta.get('fast_path', False))).lower()}\n")
              f.write(f"- age_coverage: {meta.get('age_coverage', 0.0)}\n")
              f.write(f"- fallback_reason: {meta.get('fallback_reason') or 'none'}\n")
          PY

      - id: quality
        name: Build atwiki quality report
        run: |
          full_update_args=()
          if [[ "${FULL_UPDATE}" == "true" ]]; then
            full_update_args+=(--full-update)
          fi
          uv run python -m ms_data.reporting.build_atwiki_quality_report \
            --report-date "${REPORT_DATE}" \
            --source-run-id "${GITHUB_RUN_ID}" \
            --before-msdata msData.before.json \
            --current-msdata msData.json \
            --max-failure-rate "${ATWIKI_QUALITY_MAX_FAILURE_RATE}" \
            --min-detail-record-ratio "${ATWIKI_QUALITY_MIN_DETAIL_RECORD_RATIO}" \
            --full-diff-warning-count "${ATWIKI_QUALITY_FULL_DIFF_WARNING_COUNT}" \
            --github-output "$GITHUB_OUTPUT" \
            --step-summary "$GITHUB_STEP_SUMMARY" \
            --out "reports/atwiki_quality_${REPORT_DATE}.json" \
            "${full_update_args[@]}"

      - name: Validate generated operational reports
        run: |
          test -f "reports/rollback_guard_${REPORT_DATE}.md"
          test -f "reports/official_overrides_audit_${REPORT_DATE}.md"
          test -f "reports/atwiki_quality_${REPORT_DATE}.json"
          uv run python -m ms_data.validation.validate_generated_reports \
            --reports-dir reports \
            --schema-dir schema/reports

      - name: Fail on protected official override rollback
        if: steps.official_overrides_audit.outputs.protected_rollback != '0'
        run: |
          echo "official_overrides protected rollback detected. See reports/official_overrides_audit_${REPORT_DATE}.md" >&2
          exit 1

      - id: changes
        name: Check msData changes
        run: |
          if git diff --quiet -- msData.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - id: no_change_mail
        name: Build no-change mail body
        if: github.event_name == 'schedule' && steps.changes.outputs.changed == 'false' && env.DRY_RUN != 'true'
        run: |
          body_path="$RUNNER_TEMP/msdata_no_change_mail.txt"
          uv run python -m ms_data.reporting.build_update_mail_body \
            --report-date "${REPORT_DATE}" \
            --result "成功（差分なし）" \
            --changed "false" \
            --candidate-count "${{ steps.detection.outputs.candidate_count }}" \
            --fast-path "${{ steps.detection.outputs.fast_path }}" \
            --age-coverage "${{ steps.detection.outputs.age_coverage }}" \
            --fallback-reason "${{ steps.detection.outputs.fallback_reason }}" \
            --run-id "${GITHUB_RUN_ID}" \
            --rollback-guard-path "reports/rollback_guard_${REPORT_DATE}.md" \
            --official-overrides-audit-path "reports/official_overrides_audit_${REPORT_DATE}.md" \
            --out "$body_path"
          echo "path=$body_path" >> "$GITHUB_OUTPUT"

      - name: Send no-change mail
        if: github.event_name == 'schedule' && steps.changes.outputs.changed == 'false' && env.DRY_RUN != 'true'
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GMAIL_TO: ${{ secrets.GMAIL_TO }}
        run: |
          uv run python -m ms_data.notify.send_gmail \
            --subject "msData 定期更新実行報告（差分なし, ${{ env.REPORT_DATE }}）" \
            --body "${{ steps.no_change_mail.outputs.path }}"

      - name: Generate reports and snapshot
        if: steps.changes.outputs.changed == 'true'
        run: |
          uv run python -m ms_data.reporting.report_msdata_diff \
            --old msData.before.json \
            --new msData.json \
            --out "reports/diff_msdata_${REPORT_DATE}.md" \
            --note "巻き戻りガード: reports/rollback_guard_${REPORT_DATE}.md" \
            --note "official_overrides監査: reports/official_overrides_audit_${REPORT_DATE}.md" \
            --note "atwiki品質: reports/atwiki_quality_${REPORT_DATE}.json" \
            --print-summary | tee reports/diff_summary.txt
          REPORT_DATE="${REPORT_DATE}" \
          PROVENANCE_OUT="${PROVENANCE_FILE}" \
          RAW_SNAPSHOT_FILE="${RAW_SNAPSHOT_FILE}" \
          RAW_ARTIFACT_NAME="${RAW_ARTIFACT_NAME}" \
          ARTIFACT_RETENTION_DAYS="${ARTIFACT_RETENTION_DAYS}" \
          TTL="${TTL}" \
          RATE="${RATE}" \
          LIMIT="${LIMIT}" \
          MSDATA=msData.json \
          uv run python -m ms_data.tasks snapshot

      - name: Validate generated update reports
        if: steps.changes.outputs.changed == 'true'
        run: |
          test -f "reports/provenance_${REPORT_DATE}.json"
          uv run python -m ms_data.validation.validate_generated_reports \
            --reports-dir reports \
            --schema-dir schema/reports

      - id: summary
        if: steps.changes.outputs.changed == 'true'
        name: Read summary
        run: |
          echo "summary=$(cat reports/diff_summary.txt)" >> "$GITHUB_OUTPUT"

      - name: Cleanup temp files
        if: always()
        run: rm -f msData.before.json

      - name: Upload detect state artifact
        if: always() && env.DRY_RUN != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: detect-state
          retention-days: 30
          if-no-files-found: ignore
          path: |
            cache/index_changed_meta.json
            cache/detail_fetch_state.json

      - name: Upload atwiki quality report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: atwiki-quality-${{ env.REPORT_DATE }}-run-${{ github.run_id }}
          retention-days: 30
          if-no-files-found: ignore
          path: reports/atwiki_quality_${{ env.REPORT_DATE }}.json

      - name: Upload operational reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: operational-reports-${{ env.REPORT_DATE }}-run-${{ github.run_id }}
          retention-days: 30
          if-no-files-found: ignore
          path: |
            reports/rollback_guard_${{ env.REPORT_DATE }}.md
            reports/official_overrides_audit_${{ env.REPORT_DATE }}.md

      - name: Upload raw snapshot artifact
        if: steps.changes.outputs.changed == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.RAW_ARTIFACT_NAME }}
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}
          if-no-files-found: error
          path: |
            ${{ env.RAW_SNAPSHOT_FILE }}
            reports/diff_msdata_${{ env.REPORT_DATE }}.md
            reports/provenance_${{ env.REPORT_DATE }}.json
            reports/rollback_guard_${{ env.REPORT_DATE }}.md
            reports/official_overrides_audit_${{ env.REPORT_DATE }}.md
            reports/atwiki_quality_${{ env.REPORT_DATE }}.json

      - name: Upload dry-run reports
        if: always() && env.DRY_RUN == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: msdata-dry-run-${{ env.REPORT_DATE }}-run-${{ github.run_id }}
          retention-days: 30
          if-no-files-found: ignore
          path: |
            reports/diff_msdata_${{ env.REPORT_DATE }}.md
            reports/provenance_${{ env.REPORT_DATE }}.json
            reports/rollback_guard_${{ env.REPORT_DATE }}.md
            reports/official_overrides_audit_${{ env.REPORT_DATE }}.md
            reports/atwiki_quality_${{ env.REPORT_DATE }}.json
            ${{ env.RAW_SNAPSHOT_FILE }}

      - name: Dry-run summary
        if: always() && env.DRY_RUN == 'true'
        run: |
          {
            echo "### Data Update Dry Run"
            echo "- changed: ${{ steps.changes.outputs.changed }}"
            echo "- report_date: ${REPORT_DATE}"
            echo "- raw_artifact_name: ${RAW_ARTIFACT_NAME}"
            echo "- dry_run_artifact: msdata-dry-run-${REPORT_DATE}-run-${GITHUB_RUN_ID}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Ensure pull request labels
        if: steps.changes.outputs.changed == 'true' && env.DRY_RUN != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create data-update \
            --repo "${GITHUB_REPOSITORY}" \
            --description "msData automated data update" \
            --color "1D76DB" \
            --force
          gh label create rollback-guard \
            --repo "${GITHUB_REPOSITORY}" \
            --description "Includes rollback guard report" \
            --color "D93F0B" \
            --force
          gh label create official-overrides \
            --repo "${GITHUB_REPOSITORY}" \
            --description "Touches official override audit path" \
            --color "5319E7" \
            --force
          gh label create atwiki-quality \
            --repo "${GITHUB_REPOSITORY}" \
            --description "Includes atwiki fetch quality report" \
            --color "0E8A16" \
            --force

      - name: Create pull request
        if: steps.changes.outputs.changed == 'true' && env.DRY_RUN != 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: "data: msData.json を更新（${{ env.REPORT_DATE }}; ${{ steps.summary.outputs.summary }}）"
          title: "data: msData.json を更新（${{ env.REPORT_DATE }}）"
          body: |
            自動更新（定期実行）により差分を作成しました。
            - 差分: ${{ steps.summary.outputs.summary }}
            - レポート: reports/diff_msdata_${{ env.REPORT_DATE }}.md
            - 巻き戻りガード: reports/rollback_guard_${{ env.REPORT_DATE }}.md
            - official_overrides監査: reports/official_overrides_audit_${{ env.REPORT_DATE }}.md
            - official_overrides期限: ${{ steps.official_overrides_audit.outputs.due_summary }}
            - atwiki品質: reports/atwiki_quality_${{ env.REPORT_DATE }}.json
            - atwiki品質警告: ${{ steps.quality.outputs.warning_summary }}
            - provenance: reports/provenance_${{ env.REPORT_DATE }}.json
            - source_run_id: ${{ github.run_id }}
            - source_artifact: ${{ env.RAW_ARTIFACT_NAME }}
            <!-- source_run_id:${{ github.run_id }} -->
          branch: "data/auto-update-${{ env.REPORT_DATE }}"
          labels: |
            data-update
            rollback-guard
            official-overrides
            atwiki-quality
          add-paths: |
            msData.json
            reports/diff_msdata_${{ env.REPORT_DATE }}.md
            reports/provenance_${{ env.REPORT_DATE }}.json
            reports/rollback_guard_${{ env.REPORT_DATE }}.md
            reports/official_overrides_audit_${{ env.REPORT_DATE }}.md
            reports/atwiki_quality_${{ env.REPORT_DATE }}.json
