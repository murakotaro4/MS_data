name: ci

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      code: ${{ steps.changes.outputs.code }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect code changes
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          code=true
          if [[ "$EVENT_NAME" == "pull_request" ]] && [[ -n "$BASE_SHA" && -n "$HEAD_SHA" ]]; then
            if changed_files="$(git diff --name-status --no-renames "$BASE_SHA" "$HEAD_SHA")"; then
              code=false
              while IFS=$'\t' read -r status path; do
                [[ -z "$status" && -z "$path" ]] && continue
                if [[ -z "$status" || -z "$path" || "$status" == "D" ]]; then
                  code=true
                  break
                fi
                case "$path" in
                  # tests/ 配下は fixture 含めコード変更として扱う
                  tests/*) code=true; break ;;
                  reports/*|msData.json|*.md) ;;
                  *) code=true; break ;;
                esac
              done <<< "$changed_files"
            fi
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/setup-uv-env

      - name: Validate reports contract allowlist
        run: uv run python -m ms_data.validation.validate_report_contract --mode ci --manifest reports_manifest.json --reports-dir reports

      - name: Validate msData.json
        run: uv run python -m ms_data.tasks validate-strict

      - name: Validate generated reports
        run: |
          uv run python -m ms_data.validation.validate_generated_reports \
            --reports-dir reports \
            --schema-dir schema/reports

  checks:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-2025-vs2026
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-uv-env

      - name: Run repository checks
        run: uv run python -m ms_data.tasks ci

      - name: Run actionlint
        if: matrix.os == 'ubuntu-latest'
        uses: rhysd/actionlint@v1.7.11
