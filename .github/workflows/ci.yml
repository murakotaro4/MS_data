name: ci

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-2025-vs2026
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true

      - name: Install deps
        run: uv sync --dev

      - name: Validate reports contract allowlist
        run: uv run python -m ms_data.validation.validate_report_contract --mode ci --manifest reports_manifest.yml --reports-dir reports

      - name: Run repository checks
        run: uv run python -m ms_data.tasks ci

      - name: Run actionlint
        if: matrix.os == 'ubuntu-latest'
        uses: rhysd/actionlint@v1.7.11
