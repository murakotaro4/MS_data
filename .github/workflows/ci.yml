name: ci

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-2025-vs2026
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-uv-env

      - name: Validate reports contract allowlist
        run: uv run python -m ms_data.validation.validate_report_contract --mode ci --manifest reports_manifest.yml --reports-dir reports

      - name: Run repository checks
        run: uv run python -m ms_data.tasks ci

      - name: Run actionlint
        if: matrix.os == 'ubuntu-latest'
        uses: rhysd/actionlint@v1.7.11
