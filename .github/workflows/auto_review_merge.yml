name: auto review merge

on:
  workflow_run:
    workflows:
      - data update
    types:
      - completed

permissions:
  actions: write
  contents: write
  pull-requests: write
  issues: write

jobs:
  review-and-merge:
    concurrency:
      group: auto-review-merge-${{ github.event.workflow_run.id }}
      cancel-in-progress: true
    if: >
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - id: prepare
        name: Prepare variables
        run: |
          echo "repo=${GITHUB_REPOSITORY}" >> "$GITHUB_OUTPUT"
          echo "run_id=${{ github.event.workflow_run.id }}" >> "$GITHUB_OUTPUT"
          echo "run_created_at=${{ github.event.workflow_run.created_at }}" >> "$GITHUB_OUTPUT"

      - id: resolve
        name: Resolve target PR
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ steps.prepare.outputs.repo }}
          RUN_ID: ${{ steps.prepare.outputs.run_id }}
          RUN_CREATED_AT: ${{ steps.prepare.outputs.run_created_at }}
        shell: bash
        run: |
          set -euo pipefail

          report_date="$(TZ=Asia/Tokyo date -d "${RUN_CREATED_AT}" +%Y%m%d)"
          expected_head_ref="data/auto-update-${report_date}"
          echo "expected_head_ref=${expected_head_ref}"

          pulls_json="$(gh api "repos/${REPO}/pulls?state=open&base=main&per_page=100")"
          source_marker="source_run_id:${RUN_ID}"

          by_run_id="$(jq -c --arg marker "${source_marker}" \
            '[.[] | select(.user.login=="github-actions[bot]" and (.head.ref | startswith("data/auto-update-")) and ((.body // "") | contains($marker)))] | sort_by(.created_at) | last // empty' \
            <<< "${pulls_json}")"

          if [[ -n "${by_run_id}" ]]; then
            pr_number="$(jq -r '.number' <<< "${by_run_id}")"
            head_ref="$(jq -r '.head.ref' <<< "${by_run_id}")"
            head_sha="$(jq -r '.head.sha' <<< "${by_run_id}")"
            resolved_by="source_run_id_marker"
            skip="false"
            skip_reason=""
          else
            exact_legacy="$(jq -c --arg ref "${expected_head_ref}" \
              '[.[] | select(.head.ref==$ref and .user.login=="github-actions[bot]" and (((.body // "") | contains("source_run_id:")) | not))] | sort_by(.created_at) | last // empty' \
              <<< "${pulls_json}")"

            if [[ -n "${exact_legacy}" ]]; then
              pr_number="$(jq -r '.number' <<< "${exact_legacy}")"
              head_ref="$(jq -r '.head.ref' <<< "${exact_legacy}")"
              head_sha="$(jq -r '.head.sha' <<< "${exact_legacy}")"
              resolved_by="exact_branch_legacy_no_marker"
              skip="false"
              skip_reason=""
            else
              pr_number=""
              head_ref=""
              head_sha=""
              resolved_by="not_found"
              skip="true"
              skip_reason="no_target_pr"
            fi
          fi

          echo "report_date=${report_date}" >> "$GITHUB_OUTPUT"
          echo "skip=${skip}" >> "$GITHUB_OUTPUT"
          echo "skip_reason=${skip_reason}" >> "$GITHUB_OUTPUT"
          echo "pr=${pr_number}" >> "$GITHUB_OUTPUT"
          echo "head_ref=${head_ref}" >> "$GITHUB_OUTPUT"
          echo "head_sha=${head_sha}" >> "$GITHUB_OUTPUT"
          echo "resolved_by=${resolved_by}" >> "$GITHUB_OUTPUT"

          if [[ "${skip}" == "true" ]]; then
            echo "No matching open PR found. Skip auto review merge."
          else
            echo "Resolved PR #${pr_number} (${head_ref} @ ${head_sha}) via ${resolved_by}."
          fi

      - name: No target PR found
        if: steps.resolve.outputs.skip == 'true'
        run: |
          echo "Skip auto review merge: no target PR found for report_date=${{ steps.resolve.outputs.report_date }}."
          {
            echo "### Auto Review Merge"
            echo "- status: skipped"
            echo "- reason: ${{ steps.resolve.outputs.skip_reason }}"
            echo "- report_date: ${{ steps.resolve.outputs.report_date }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Validate report contract (auto-review)
        if: steps.resolve.outputs.skip != 'true'
        run: |
          uv run python -m scripts.validate_report_contract \
            --mode auto-review \
            --manifest reports_manifest.yml \
            --report-date "${{ steps.resolve.outputs.report_date }}" \
            --head-ref "${{ steps.resolve.outputs.head_ref }}"

      - id: trigger
        name: Trigger Codex review
        if: steps.resolve.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ steps.prepare.outputs.repo }}
          PR_NUMBER: ${{ steps.resolve.outputs.pr }}
          HEAD_SHA: ${{ steps.resolve.outputs.head_sha }}
        shell: bash
        run: |
          set -euo pipefail

          marker="<!-- auto-review head_sha:${HEAD_SHA} -->"
          existing_id="$(gh api "repos/${REPO}/issues/${PR_NUMBER}/comments" --paginate | \
            jq -r --arg marker "${marker}" \
            '[.[] | select(.user.login=="github-actions[bot]" and (.body | contains($marker)))] | sort_by(.created_at) | last | .id // empty')"

          if [[ -z "${existing_id}" ]]; then
            comment_body=$'@codex review\n\n'"${marker}"
            trigger_comment_id="$(gh api -X POST "repos/${REPO}/issues/${PR_NUMBER}/comments" \
              -f body="${comment_body}" \
              --jq '.id')"
            created_new=true
          else
            trigger_comment_id="${existing_id}"
            created_new=false
          fi

          trigger_created_at="$(gh api "repos/${REPO}/issues/comments/${trigger_comment_id}" --jq '.created_at')"

          echo "trigger_comment_id=${trigger_comment_id}" >> "$GITHUB_OUTPUT"
          echo "trigger_created_at=${trigger_created_at}" >> "$GITHUB_OUTPUT"
          echo "created_new=${created_new}" >> "$GITHUB_OUTPUT"

      - id: wait
        name: Wait for Codex response (max 20m)
        if: steps.resolve.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ steps.prepare.outputs.repo }}
          PR_NUMBER: ${{ steps.resolve.outputs.pr }}
          HEAD_SHA: ${{ steps.resolve.outputs.head_sha }}
          TRIGGER_COMMENT_ID: ${{ steps.trigger.outputs.trigger_comment_id }}
          TRIGGER_COMMENT_CREATED_AT: ${{ steps.trigger.outputs.trigger_created_at }}
        shell: bash
        run: |
          set -euo pipefail

          deadline=$((SECONDS + 1200))
          responded=false

          while (( SECONDS < deadline )); do
            review_count="$(gh api "repos/${REPO}/pulls/${PR_NUMBER}/reviews" --paginate | \
              jq -r --arg sha "${HEAD_SHA}" \
              '[.[] | select((.user.login=="chatgpt-codex-connector[bot]" or .user.login=="chatgpt-codex-connector") and .commit_id==$sha)] | length')"

            file_comment_count="$(gh api "repos/${REPO}/pulls/${PR_NUMBER}/comments" --paginate | \
              jq -r --arg sha "${HEAD_SHA}" \
              '[.[] | select((.user.login=="chatgpt-codex-connector[bot]" or .user.login=="chatgpt-codex-connector") and .commit_id==$sha)] | length')"

            reaction_count="$(gh api "repos/${REPO}/issues/comments/${TRIGGER_COMMENT_ID}/reactions" \
              --paginate \
              -H "Accept: application/vnd.github+json" \
              | jq -r '[.[] | select((.user.login=="chatgpt-codex-connector[bot]" or .user.login=="chatgpt-codex-connector") and .content=="+1")] | length')"

            issue_comment_count="$(gh api "repos/${REPO}/issues/${PR_NUMBER}/comments" --paginate | \
              jq -r --arg since "${TRIGGER_COMMENT_CREATED_AT}" \
              '[.[] | select((.user.login=="chatgpt-codex-connector[bot]" or .user.login=="chatgpt-codex-connector") and .created_at >= $since)] | length')"

            if (( review_count + file_comment_count + reaction_count + issue_comment_count > 0 )); then
              responded=true
              break
            fi

            sleep 30
          done

          echo "responded=${responded}" >> "$GITHUB_OUTPUT"

      - id: gate
        name: Check Codex findings
        if: steps.resolve.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ steps.prepare.outputs.repo }}
          PR_NUMBER: ${{ steps.resolve.outputs.pr }}
          HEAD_SHA: ${{ steps.resolve.outputs.head_sha }}
          RESPONDED: ${{ steps.wait.outputs.responded }}
        shell: bash
        run: |
          set -euo pipefail

          findings="$(gh api "repos/${REPO}/pulls/${PR_NUMBER}/comments" --paginate | \
            jq -r --arg sha "${HEAD_SHA}" \
            '[.[] | select((.user.login=="chatgpt-codex-connector[bot]" or .user.login=="chatgpt-codex-connector") and .commit_id==$sha)] | length')"

          echo "findings=${findings}" >> "$GITHUB_OUTPUT"

          if [[ "${RESPONDED}" != "true" ]]; then
            echo "merge_ok=false" >> "$GITHUB_OUTPUT"
            echo "stop_reason=no_response" >> "$GITHUB_OUTPUT"
          elif [[ "${findings}" -eq 0 ]]; then
            echo "merge_ok=true" >> "$GITHUB_OUTPUT"
            echo "stop_reason=none" >> "$GITHUB_OUTPUT"
          else
            echo "merge_ok=false" >> "$GITHUB_OUTPUT"
            echo "stop_reason=findings" >> "$GITHUB_OUTPUT"
          fi

      - name: Record stop reason
        if: steps.resolve.outputs.skip != 'true' && steps.gate.outputs.merge_ok != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ steps.prepare.outputs.repo }}
          PR_NUMBER: ${{ steps.resolve.outputs.pr }}
          HEAD_SHA: ${{ steps.resolve.outputs.head_sha }}
          FINDINGS: ${{ steps.gate.outputs.findings }}
          STOP_REASON: ${{ steps.gate.outputs.stop_reason }}
          RUN_ID: ${{ steps.prepare.outputs.run_id }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${STOP_REASON}" == "no_response" ]]; then
            reason_label="codex_no_response"
            message="Codex の応答を20分待機しましたが確認できなかったため、自動マージを停止しました。手動で確認してください。 (run_id: ${RUN_ID})"
          else
            reason_label="codex_findings"
            message="Codex のファイル指摘が ${FINDINGS} 件あるため、自動マージを停止しました。手動で確認してください。 (run_id: ${RUN_ID})"
          fi

          marker="<!-- auto-review-stop reason:${reason_label} run_id:${RUN_ID} head_sha:${HEAD_SHA} -->"
          existing_id="$(gh api "repos/${REPO}/issues/${PR_NUMBER}/comments" --paginate | \
            jq -r --arg marker "${marker}" \
            '[.[] | select(.user.login=="github-actions[bot]" and ((.body // "") | contains($marker)))] | sort_by(.created_at) | last | .id // empty')"

          if [[ -z "${existing_id}" ]]; then
            gh api -X POST "repos/${REPO}/issues/${PR_NUMBER}/comments" \
              -f body="${message}"$'\n\n'"${marker}" >/dev/null
            posted="true"
          else
            posted="false"
          fi

          {
            echo "### Auto Review Merge"
            echo "- status: stopped"
            echo "- reason: ${reason_label}"
            echo "- pr: #${PR_NUMBER}"
            echo "- head_sha: ${HEAD_SHA}"
            if [[ "${STOP_REASON}" == "findings" ]]; then
              echo "- findings: ${FINDINGS}"
            fi
            echo "- comment_posted: ${posted}"
          } >> "$GITHUB_STEP_SUMMARY"

      - id: merge
        name: Merge pull request
        if: steps.resolve.outputs.skip != 'true' && steps.gate.outputs.merge_ok == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ steps.prepare.outputs.repo }}
          PR_NUMBER: ${{ steps.resolve.outputs.pr }}
          HEAD_REF: ${{ steps.resolve.outputs.head_ref }}
        shell: bash
        run: |
          set -euo pipefail
          state="$(gh pr view "${PR_NUMBER}" --repo "${REPO}" --json state --jq '.state')"
          if [[ "${state}" != "OPEN" ]]; then
            echo "PR state is ${state}. Skip merge."
            echo "merged=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          gh pr merge "${PR_NUMBER}" --repo "${REPO}" --merge --delete-branch

          merged_state="$(gh pr view "${PR_NUMBER}" --repo "${REPO}" --json state --jq '.state')"
          if [[ "${merged_state}" != "MERGED" ]]; then
            echo "PR state after merge attempt is ${merged_state}."
            echo "merged=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          merge_commit_sha="$(gh pr view "${PR_NUMBER}" --repo "${REPO}" --json mergeCommit --jq '.mergeCommit.oid')"
          echo "merged=true" >> "$GITHUB_OUTPUT"
          echo "merge_commit_sha=${merge_commit_sha}" >> "$GITHUB_OUTPUT"
          echo "head_ref=${HEAD_REF}" >> "$GITHUB_OUTPUT"

      - name: Trigger post merge notify workflow
        if: steps.resolve.outputs.skip != 'true' && steps.gate.outputs.merge_ok == 'true' && steps.merge.outputs.merged == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ steps.prepare.outputs.repo }}
          MERGE_COMMIT_SHA: ${{ steps.merge.outputs.merge_commit_sha }}
          HEAD_REF: ${{ steps.merge.outputs.head_ref }}
          SOURCE_RUN_ID: ${{ steps.prepare.outputs.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run post_merge_notify.yml \
            --repo "${REPO}" \
            -f merge_commit_sha="${MERGE_COMMIT_SHA}" \
            -f head_ref="${HEAD_REF}" \
            -f source_run_id="${SOURCE_RUN_ID}"
