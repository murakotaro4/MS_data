name: auto review merge

on:
  workflow_run:
    workflows:
      - data update
    types:
      - completed

permissions:
  actions: write
  contents: write
  pull-requests: write
  issues: write

jobs:
  review-and-merge:
    concurrency:
      group: auto-review-merge-${{ github.event.workflow_run.id }}
      cancel-in-progress: true
    if: >
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      CODEX_REVIEW_MAX_ATTEMPTS: ${{ vars.CODEX_REVIEW_MAX_ATTEMPTS || '3' }}
      CODEX_REVIEW_ATTEMPT_TIMEOUT_SECONDS: ${{ vars.CODEX_REVIEW_ATTEMPT_TIMEOUT_SECONDS || '420' }}
      CODEX_REVIEW_POLL_SECONDS: ${{ vars.CODEX_REVIEW_POLL_SECONDS || '30' }}
      CODEX_REVIEW_SETTLE_SECONDS: ${{ vars.CODEX_REVIEW_SETTLE_SECONDS || '60' }}
    steps:
      - id: prepare
        name: Prepare variables
        run: |
          echo "repo=${GITHUB_REPOSITORY}" >> "$GITHUB_OUTPUT"
          echo "run_id=${{ github.event.workflow_run.id }}" >> "$GITHUB_OUTPUT"
          echo "run_created_at=${{ github.event.workflow_run.created_at }}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true

      - name: Install deps
        run: uv sync --dev

      - id: resolve
        name: Resolve target PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          uv run python -m scripts.auto_review_merge resolve-target-pr \
            --repo "${{ steps.prepare.outputs.repo }}" \
            --run-id "${{ steps.prepare.outputs.run_id }}" \
            --run-created-at "${{ steps.prepare.outputs.run_created_at }}" \
            --github-output "$GITHUB_OUTPUT"

      - name: No target PR found
        if: steps.resolve.outputs.skip == 'true'
        run: |
          echo "Skip auto review merge: no target PR found for report_date=${{ steps.resolve.outputs.report_date }}."
          {
            echo "### Auto Review Merge"
            echo "- status: skipped"
            echo "- reason: ${{ steps.resolve.outputs.skip_reason }}"
            echo "- report_date: ${{ steps.resolve.outputs.report_date }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Validate report contract (auto-review)
        if: steps.resolve.outputs.skip != 'true'
        run: |
          uv run python -m scripts.validate_report_contract \
            --mode auto-review \
            --manifest reports_manifest.yml \
            --report-date "${{ steps.resolve.outputs.report_date }}" \
            --head-ref "${{ steps.resolve.outputs.head_ref }}"

      - id: trigger
        name: Trigger Codex review
        if: steps.resolve.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          uv run python -m scripts.auto_review_merge trigger-review \
            --repo "${{ steps.prepare.outputs.repo }}" \
            --pr-number "${{ steps.resolve.outputs.pr }}" \
            --head-sha "${{ steps.resolve.outputs.head_sha }}" \
            --github-output "$GITHUB_OUTPUT"

      - id: wait
        name: Wait for Codex response with retries
        if: steps.resolve.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          uv run python -m scripts.auto_review_merge wait-for-review \
            --repo "${{ steps.prepare.outputs.repo }}" \
            --pr-number "${{ steps.resolve.outputs.pr }}" \
            --head-sha "${{ steps.resolve.outputs.head_sha }}" \
            --trigger-comment-id "${{ steps.trigger.outputs.trigger_comment_id }}" \
            --trigger-comment-created-at "${{ steps.trigger.outputs.trigger_created_at }}" \
            --max-attempts "${CODEX_REVIEW_MAX_ATTEMPTS}" \
            --attempt-timeout-seconds "${CODEX_REVIEW_ATTEMPT_TIMEOUT_SECONDS}" \
            --poll-seconds "${CODEX_REVIEW_POLL_SECONDS}" \
            --settle-seconds "${CODEX_REVIEW_SETTLE_SECONDS}" \
            --github-output "$GITHUB_OUTPUT" \
            --step-summary "$GITHUB_STEP_SUMMARY"

      - id: gate
        name: Check Codex findings
        if: steps.resolve.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          uv run python -m scripts.auto_review_merge check-gate \
            --repo "${{ steps.prepare.outputs.repo }}" \
            --pr-number "${{ steps.resolve.outputs.pr }}" \
            --head-sha "${{ steps.resolve.outputs.head_sha }}" \
            --trigger-comment-ids "${{ steps.wait.outputs.trigger_comment_ids }}" \
            --first-trigger-created-at "${{ steps.wait.outputs.first_trigger_created_at }}" \
            --github-output "$GITHUB_OUTPUT"

      - name: Record stop reason
        if: steps.resolve.outputs.skip != 'true' && steps.gate.outputs.merge_ok != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          uv run python -m scripts.auto_review_merge record-stop \
            --repo "${{ steps.prepare.outputs.repo }}" \
            --pr-number "${{ steps.resolve.outputs.pr }}" \
            --head-sha "${{ steps.resolve.outputs.head_sha }}" \
            --findings "${{ steps.gate.outputs.findings }}" \
            --stop-reason "${{ steps.gate.outputs.stop_reason }}" \
            --run-id "${{ steps.prepare.outputs.run_id }}" \
            --attempts-used "${{ steps.wait.outputs.attempts_used }}" \
            --max-attempts "${{ steps.wait.outputs.max_attempts }}" \
            --attempt-timeout-seconds "${{ steps.wait.outputs.attempt_timeout_seconds }}" \
            --step-summary "$GITHUB_STEP_SUMMARY"

      - id: merge
        name: Merge pull request
        if: steps.resolve.outputs.skip != 'true' && steps.gate.outputs.merge_ok == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ steps.prepare.outputs.repo }}
          PR_NUMBER: ${{ steps.resolve.outputs.pr }}
          HEAD_REF: ${{ steps.resolve.outputs.head_ref }}
        shell: bash
        run: |
          set -euo pipefail
          state="$(gh pr view "${PR_NUMBER}" --repo "${REPO}" --json state --jq '.state')"
          if [[ "${state}" != "OPEN" ]]; then
            echo "PR state is ${state}. Skip merge."
            echo "merged=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          gh pr merge "${PR_NUMBER}" --repo "${REPO}" --merge --delete-branch

          merged_state="$(gh pr view "${PR_NUMBER}" --repo "${REPO}" --json state --jq '.state')"
          if [[ "${merged_state}" != "MERGED" ]]; then
            echo "PR state after merge attempt is ${merged_state}."
            echo "merged=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          merge_commit_sha="$(gh pr view "${PR_NUMBER}" --repo "${REPO}" --json mergeCommit --jq '.mergeCommit.oid')"
          echo "merged=true" >> "$GITHUB_OUTPUT"
          echo "merge_commit_sha=${merge_commit_sha}" >> "$GITHUB_OUTPUT"
          echo "head_ref=${HEAD_REF}" >> "$GITHUB_OUTPUT"

      - name: Trigger post merge notify workflow
        if: steps.resolve.outputs.skip != 'true' && steps.gate.outputs.merge_ok == 'true' && steps.merge.outputs.merged == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ steps.prepare.outputs.repo }}
          MERGE_COMMIT_SHA: ${{ steps.merge.outputs.merge_commit_sha }}
          HEAD_REF: ${{ steps.merge.outputs.head_ref }}
          SOURCE_RUN_ID: ${{ steps.prepare.outputs.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run post_merge_notify.yml \
            --repo "${REPO}" \
            -f merge_commit_sha="${MERGE_COMMIT_SHA}" \
            -f head_ref="${HEAD_REF}" \
            -f source_run_id="${SOURCE_RUN_ID}"
