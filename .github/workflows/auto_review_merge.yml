name: auto review merge

on:
  workflow_run:
    workflows:
      - data update
    types:
      - completed

permissions:
  contents: read

jobs:
  review-and-merge:
    permissions:
      actions: write
      contents: write
      pull-requests: write
      issues: write
    concurrency:
      group: msdata-auto-review-merge
      cancel-in-progress: false
    if: >
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CODEX_REVIEW_MAX_ATTEMPTS: ${{ vars.CODEX_REVIEW_MAX_ATTEMPTS || '3' }}
      CODEX_REVIEW_ATTEMPT_TIMEOUT_SECONDS: ${{ vars.CODEX_REVIEW_ATTEMPT_TIMEOUT_SECONDS || '420' }}
      CODEX_REVIEW_POLL_SECONDS: ${{ vars.CODEX_REVIEW_POLL_SECONDS || '30' }}
      CODEX_REVIEW_SETTLE_SECONDS: ${{ vars.CODEX_REVIEW_SETTLE_SECONDS || '60' }}
    steps:
      - id: prepare
        name: Prepare variables
        run: |
          echo "repo=${GITHUB_REPOSITORY}" >> "$GITHUB_OUTPUT"
          echo "run_id=${{ github.event.workflow_run.id }}" >> "$GITHUB_OUTPUT"
          echo "run_created_at=${{ github.event.workflow_run.created_at }}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-uv-env

      - id: resolve
        name: Resolve target PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          uv run python -m ms_data.gh.auto_review_merge resolve-target-pr \
            --repo "${{ steps.prepare.outputs.repo }}" \
            --run-id "${{ steps.prepare.outputs.run_id }}" \
            --run-created-at "${{ steps.prepare.outputs.run_created_at }}" \
            --github-output "$GITHUB_OUTPUT"

      - name: No target PR found
        if: steps.resolve.outputs.skip == 'true'
        env:
          SKIP_REASON: ${{ steps.resolve.outputs.skip_reason }}
        run: |
          echo "Skip auto review merge: no target PR found for report_date=${{ steps.resolve.outputs.report_date }}."
          {
            echo "### Auto Review Merge"
            echo "- status: skipped"
            echo "- reason: $SKIP_REASON"
            echo "- report_date: ${{ steps.resolve.outputs.report_date }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Validate report contract (auto-review)
        if: steps.resolve.outputs.skip != 'true'
        env:
          HEAD_REF: ${{ steps.resolve.outputs.head_ref }}
        run: |
          uv run python -m ms_data.validation.validate_report_contract \
            --mode auto-review \
            --manifest reports_manifest.json \
            --report-date "${{ steps.resolve.outputs.report_date }}" \
            --head-ref "$HEAD_REF"

      - id: baseline
        name: Establish review baseline
        if: steps.resolve.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          uv run python -m ms_data.gh.auto_review_merge establish-baseline \
            --repo "${{ steps.prepare.outputs.repo }}" \
            --pr-number "${{ steps.resolve.outputs.pr }}" \
            --github-output "$GITHUB_OUTPUT"

      - id: pat
        name: Resolve Codex trigger PAT
        if: steps.resolve.outputs.skip != 'true'
        env:
          CODEX_TRIGGER_PAT: ${{ secrets.CODEX_TRIGGER_PAT }}
        shell: bash
        run: |
          set -euo pipefail
          pat_available=false
          pat_login=""
          if [[ -n "${CODEX_TRIGGER_PAT}" ]]; then
            if login="$(GH_TOKEN="${CODEX_TRIGGER_PAT}" gh api user --jq .login)" && [[ -n "${login}" ]]; then
              pat_available=true
              pat_login="${login}"
            else
              echo "Warning: CODEX_TRIGGER_PAT is set but login resolution failed; falling back without PAT."
              pat_available=false
              pat_login=""
            fi
          fi
          echo "pat_available=${pat_available}" >> "$GITHUB_OUTPUT"
          echo "pat_login=${pat_login}" >> "$GITHUB_OUTPUT"

      - id: wait
        name: Wait for Codex response with retries
        if: steps.resolve.outputs.skip != 'true'
        env:
          GITHUB_TOKEN_DEFAULT: ${{ github.token }}
          CODEX_TRIGGER_PAT: ${{ secrets.CODEX_TRIGGER_PAT }}
          PAT_AVAILABLE: ${{ steps.pat.outputs.pat_available }}
          PAT_LOGIN: ${{ steps.pat.outputs.pat_login }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${PAT_AVAILABLE}" == "true" ]]; then
            export GH_TOKEN="${CODEX_TRIGGER_PAT}"
          else
            export GH_TOKEN="${GITHUB_TOKEN_DEFAULT}"
          fi
          uv run python -m ms_data.gh.auto_review_merge wait-for-review \
            --repo "${{ steps.prepare.outputs.repo }}" \
            --pr-number "${{ steps.resolve.outputs.pr }}" \
            --head-sha "${{ steps.resolve.outputs.head_sha }}" \
            --baseline-created-at "${{ steps.baseline.outputs.baseline_created_at }}" \
            --max-attempts "${CODEX_REVIEW_MAX_ATTEMPTS}" \
            --attempt-timeout-seconds "${CODEX_REVIEW_ATTEMPT_TIMEOUT_SECONDS}" \
            --poll-seconds "${CODEX_REVIEW_POLL_SECONDS}" \
            --settle-seconds "${CODEX_REVIEW_SETTLE_SECONDS}" \
            --pat-available "${PAT_AVAILABLE}" \
            --pat-login "${PAT_LOGIN}" \
            --github-output "$GITHUB_OUTPUT" \
            --step-summary "$GITHUB_STEP_SUMMARY"

      - id: gate
        name: Check Codex findings
        if: steps.resolve.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TRIGGER_COMMENT_IDS: ${{ steps.wait.outputs.trigger_comment_ids }}
        run: |
          uv run python -m ms_data.gh.auto_review_merge check-gate \
            --repo "${{ steps.prepare.outputs.repo }}" \
            --pr-number "${{ steps.resolve.outputs.pr }}" \
            --head-sha "${{ steps.resolve.outputs.head_sha }}" \
            --trigger-comment-ids "$TRIGGER_COMMENT_IDS" \
            --first-trigger-created-at "${{ steps.baseline.outputs.baseline_created_at }}" \
            --github-output "$GITHUB_OUTPUT"

      - name: Export findings
        if: >
          steps.resolve.outputs.skip != 'true'
          && steps.gate.outputs.merge_ok != 'true'
          && steps.gate.outputs.stop_reason == 'findings'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          uv run python -m ms_data.gh.auto_review_merge export-findings \
            --repo "${{ steps.prepare.outputs.repo }}" \
            --pr-number "${{ steps.resolve.outputs.pr }}" \
            --head-sha "${{ steps.resolve.outputs.head_sha }}" \
            --out "$RUNNER_TEMP/codex_findings.json" \
            --github-output "$GITHUB_OUTPUT"

      - name: Record stop reason
        if: steps.resolve.outputs.skip != 'true' && steps.gate.outputs.merge_ok != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          FINDINGS: ${{ steps.gate.outputs.findings }}
          STOP_REASON: ${{ steps.gate.outputs.stop_reason }}
        run: |
          uv run python -m ms_data.gh.auto_review_merge record-stop \
            --repo "${{ steps.prepare.outputs.repo }}" \
            --pr-number "${{ steps.resolve.outputs.pr }}" \
            --head-sha "${{ steps.resolve.outputs.head_sha }}" \
            --findings "$FINDINGS" \
            --stop-reason "$STOP_REASON" \
            --run-id "${{ steps.prepare.outputs.run_id }}" \
            --attempts-used "${{ steps.wait.outputs.attempts_used }}" \
            --max-attempts "${{ steps.wait.outputs.max_attempts }}" \
            --attempt-timeout-seconds "${{ steps.wait.outputs.attempt_timeout_seconds }}" \
            --step-summary "$GITHUB_STEP_SUMMARY"

      - name: Notify stop by mail
        if: steps.resolve.outputs.skip != 'true' && steps.gate.outputs.merge_ok != 'true'
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GMAIL_TO: ${{ secrets.GMAIL_ADDRESS }}
          STOP_REASON: ${{ steps.gate.outputs.stop_reason }}
          PR_NUMBER: ${{ steps.resolve.outputs.pr }}
          REPORT_DATE: ${{ steps.resolve.outputs.report_date }}
          REPO: ${{ steps.prepare.outputs.repo }}
        shell: bash
        run: |
          set -euo pipefail
          pr_url="${GITHUB_SERVER_URL}/${REPO}/pull/${PR_NUMBER}"
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          args=(
            --stop-reason "${STOP_REASON}"
            --pr-number "${PR_NUMBER}"
            --pr-url "${pr_url}"
            --report-date "${REPORT_DATE}"
            --run-url "${run_url}"
          )
          if [[ "${STOP_REASON}" == "findings" ]]; then
            args+=(--findings-json "${RUNNER_TEMP}/codex_findings.json")
          fi
          uv run python -m ms_data.gh.notify_review_stop "${args[@]}"

      - id: merge
        name: Merge pull request
        if: steps.resolve.outputs.skip != 'true' && steps.gate.outputs.merge_ok == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          uv run python -m ms_data.gh.auto_review_merge merge \
            --repo "${{ steps.prepare.outputs.repo }}" \
            --pr-number "${{ steps.resolve.outputs.pr }}" \
            --head-ref "${{ steps.resolve.outputs.head_ref }}" \
            --head-sha "${{ steps.resolve.outputs.head_sha }}" \
            --source-run-id "${{ steps.prepare.outputs.run_id }}" \
            --github-output "$GITHUB_OUTPUT" \
            --step-summary "$GITHUB_STEP_SUMMARY" \
            --skip-if-not-open \
            --dispatch-notify true

      - name: Write auto review report
        if: always() && steps.resolve.outputs.skip == 'false'
        env:
          HEAD_REF: ${{ steps.resolve.outputs.head_ref }}
          TRIGGER_COMMENT_IDS: ${{ steps.wait.outputs.trigger_comment_ids }}
          FINDINGS: ${{ steps.gate.outputs.findings }}
          STOP_REASON: ${{ steps.gate.outputs.stop_reason }}
        run: |
          uv run python -m ms_data.gh.auto_review_merge write-report \
            --report-date "${{ steps.resolve.outputs.report_date }}" \
            --run-id "${{ steps.prepare.outputs.run_id }}" \
            --pr-number "${{ steps.resolve.outputs.pr }}" \
            --head-ref "$HEAD_REF" \
            --head-sha "${{ steps.resolve.outputs.head_sha }}" \
            --responded "${{ steps.wait.outputs.responded }}" \
            --attempts-used "${{ steps.wait.outputs.attempts_used }}" \
            --max-attempts "${{ steps.wait.outputs.max_attempts }}" \
            --attempt-timeout-seconds "${{ steps.wait.outputs.attempt_timeout_seconds }}" \
            --poll-seconds "${{ steps.wait.outputs.poll_seconds }}" \
            --settle-seconds "${{ steps.wait.outputs.settle_seconds }}" \
            --response-attempt "${{ steps.wait.outputs.response_attempt }}" \
            --response-seconds "${{ steps.wait.outputs.response_seconds }}" \
            --trigger-comment-ids "$TRIGGER_COMMENT_IDS" \
            --first-trigger-created-at "${{ steps.wait.outputs.first_trigger_created_at }}" \
            --findings "$FINDINGS" \
            --review-complete "${{ steps.gate.outputs.review_complete }}" \
            --merge-ok "${{ steps.gate.outputs.merge_ok }}" \
            --merged "${{ steps.merge.outputs.merged }}" \
            --merge-outcome "${{ steps.merge.outcome }}" \
            --stop-reason "$STOP_REASON" \
            --out "reports/auto_review_${{ steps.resolve.outputs.report_date }}.json" \
            --step-summary "$GITHUB_STEP_SUMMARY"

      - name: Validate auto review report
        if: always() && steps.resolve.outputs.skip == 'false'
        run: |
          test -f "reports/auto_review_${{ steps.resolve.outputs.report_date }}.json"
          uv run python -m ms_data.validation.validate_generated_reports \
            --reports-dir reports \
            --schema-dir schema/reports

      - name: Upload auto review report
        if: always() && steps.resolve.outputs.skip == 'false'
        uses: actions/upload-artifact@v7
        with:
          name: auto-review-${{ steps.resolve.outputs.report_date }}-run-${{ steps.prepare.outputs.run_id }}
          retention-days: 30
          if-no-files-found: ignore
          path: reports/auto_review_${{ steps.resolve.outputs.report_date }}.json
