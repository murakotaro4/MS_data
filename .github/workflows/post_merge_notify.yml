name: post merge notify

on:
  pull_request:
    types: [closed]
  workflow_dispatch:
    inputs:
      merge_commit_sha:
        description: "Merged commit SHA"
        required: true
        type: string
      head_ref:
        description: "PR head ref"
        required: true
        type: string
      source_run_id:
        description: "Source data update run id"
        required: false
        type: string
      send_mail:
        description: "Send merged mail notification"
        required: false
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  notify:
    permissions:
      actions: read
      contents: write
    if: >
      (
        github.event_name == 'pull_request' &&
        github.event.pull_request.merged == true &&
        github.event.pull_request.base.ref == 'main' &&
        startsWith(github.event.pull_request.head.ref, 'data/auto-update-')
      ) ||
      (
        github.event_name == 'workflow_dispatch' &&
        startsWith(github.event.inputs.head_ref, 'data/auto-update-')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: Asia/Tokyo
      HEAD_REF: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.head_ref || github.event.pull_request.head.ref }}
      MERGE_COMMIT_SHA: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.merge_commit_sha || github.event.pull_request.merge_commit_sha }}
      SOURCE_RUN_ID_INPUT: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.source_run_id || '' }}
      PR_BODY: ${{ github.event_name == 'pull_request' && github.event.pull_request.body || '' }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.MERGE_COMMIT_SHA }}

      - uses: ./.github/actions/setup-uv-env

      - id: report
        name: Resolve report file
        shell: bash
        run: |
          set -euo pipefail
          python -m ms_data.gh.post_merge_assets \
            --head-ref "${HEAD_REF}" \
            --source-run-id "${SOURCE_RUN_ID_INPUT}" \
            --pr-body-env PR_BODY \
            --root . \
            --require-files \
            --github-output "$GITHUB_OUTPUT"

      - name: Validate report contract (post-merge)
        env:
          SOURCE_RUN_ID: ${{ steps.report.outputs.source_run_id }}
          ARTIFACT_NAME: ${{ steps.report.outputs.artifact_name }}
          SNAPSHOT_FILE: ${{ steps.report.outputs.snapshot_file }}
          RELEASE_TAG: ${{ steps.report.outputs.release_tag }}
        run: |
          uv run python -m ms_data.validation.validate_report_contract \
            --mode post-merge \
            --manifest reports_manifest.json \
            --report-date "${{ steps.report.outputs.report_date }}" \
            --source-run-id "$SOURCE_RUN_ID" \
            --head-ref "${HEAD_REF}" \
            --diff-path "${{ steps.report.outputs.report_path }}" \
            --provenance-path "${{ steps.report.outputs.provenance_path }}" \
            --artifact-name "$ARTIFACT_NAME" \
            --snapshot-file "$SNAPSHOT_FILE" \
            --release-tag "$RELEASE_TAG"

      - name: Download raw snapshot artifact
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ steps.report.outputs.source_run_id }}
          ARTIFACT_NAME: ${{ steps.report.outputs.artifact_name }}
          SNAPSHOT_ASSET_PATH: ${{ steps.report.outputs.snapshot_asset_path }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf release_assets
          mkdir -p release_assets
          gh run download "$SOURCE_RUN_ID" \
            --repo "${GITHUB_REPOSITORY}" \
            --name "$ARTIFACT_NAME" \
            --dir release_assets

          if [[ ! -f "$SNAPSHOT_ASSET_PATH" ]]; then
            echo "スナップショットファイルが見つかりません: $SNAPSHOT_ASSET_PATH" >&2
            find release_assets -maxdepth 4 -type f -print || true
            exit 1
          fi

      - id: release
        name: Publish raw snapshot release
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ steps.report.outputs.source_run_id }}
          ARTIFACT_NAME: ${{ steps.report.outputs.artifact_name }}
          SNAPSHOT_FILE: ${{ steps.report.outputs.snapshot_file }}
          RELEASE_TAG: ${{ steps.report.outputs.release_tag }}
          SNAPSHOT_ASSET_PATH: ${{ steps.report.outputs.snapshot_asset_path }}
        shell: bash
        run: |
          set -euo pipefail

          tag="$RELEASE_TAG"
          title="raw snapshot ${{ steps.report.outputs.report_date }} (run $SOURCE_RUN_ID)"
          created="false"
          notes=$(
            cat <<EOF
          自動保存された生データスナップショットです。

          - source_run_id: $SOURCE_RUN_ID
          - source_artifact: $ARTIFACT_NAME
          - snapshot: $SNAPSHOT_FILE
          EOF
          )

          if ! gh release view "${tag}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release create "${tag}" \
              --repo "${GITHUB_REPOSITORY}" \
              --title "${title}" \
              --notes "${notes}"
            created="true"
          fi

          gh release upload "${tag}" \
            "$SNAPSHOT_ASSET_PATH" \
            --repo "${GITHUB_REPOSITORY}" \
            --clobber

          if [[ -f "${{ steps.report.outputs.provenance_asset_path }}" ]]; then
            gh release upload "${tag}" \
              "${{ steps.report.outputs.provenance_asset_path }}" \
              --repo "${GITHUB_REPOSITORY}" \
              --clobber
          fi

          if [[ -f "${{ steps.report.outputs.report_asset_path }}" ]]; then
            gh release upload "${tag}" \
              "${{ steps.report.outputs.report_asset_path }}" \
              --repo "${GITHUB_REPOSITORY}" \
              --clobber
          fi

          if [[ -f "${{ steps.report.outputs.rollback_guard_asset_path }}" ]]; then
            gh release upload "${tag}" \
              "${{ steps.report.outputs.rollback_guard_asset_path }}" \
              --repo "${GITHUB_REPOSITORY}" \
              --clobber
          fi

          if [[ -f "${{ steps.report.outputs.official_overrides_audit_asset_path }}" ]]; then
            gh release upload "${tag}" \
              "${{ steps.report.outputs.official_overrides_audit_asset_path }}" \
              --repo "${GITHUB_REPOSITORY}" \
              --clobber
          fi

          if [[ -f "${{ steps.report.outputs.atwiki_quality_asset_path }}" ]]; then
            gh release upload "${tag}" \
              "${{ steps.report.outputs.atwiki_quality_asset_path }}" \
              --repo "${GITHUB_REPOSITORY}" \
              --clobber
          fi

          release_url="$(gh release view "${tag}" --repo "${GITHUB_REPOSITORY}" --json url --jq '.url')"
          echo "release_url=${release_url}" >> "$GITHUB_OUTPUT"
          echo "created=${created}" >> "$GITHUB_OUTPUT"

      - id: mail_body
        name: Build merged msData mail body
        if: steps.release.outputs.created == 'true' || github.run_attempt != '1' || (github.event_name == 'workflow_dispatch' && github.event.inputs.send_mail == 'true')
        env:
          SOURCE_RUN_ID: ${{ steps.report.outputs.source_run_id }}
        run: |
          body_path="$RUNNER_TEMP/msdata_merged_mail.txt"
          uv run python -m ms_data.reporting.build_update_mail_body \
            --report-date "${{ steps.report.outputs.report_date }}" \
            --result "マージ済み" \
            --changed "true" \
            --source-run-id "$SOURCE_RUN_ID" \
            --release-url "${{ steps.release.outputs.release_url }}" \
            --diff-path "${{ steps.report.outputs.report_path }}" \
            --rollback-guard-path "${{ steps.report.outputs.rollback_guard_path }}" \
            --official-overrides-audit-path "${{ steps.report.outputs.official_overrides_audit_path }}" \
            --out "$body_path"
          echo "path=$body_path" >> "$GITHUB_OUTPUT"

      - name: Send merged msData mail
        if: steps.release.outputs.created == 'true' || github.run_attempt != '1' || (github.event_name == 'workflow_dispatch' && github.event.inputs.send_mail == 'true')
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GMAIL_TO: ${{ secrets.GMAIL_TO }}
        run: |
          uv run python -m ms_data.notify.send_gmail \
            --subject "msData 更新反映通知 (${{ steps.report.outputs.report_date }})" \
            --body "${{ steps.mail_body.outputs.path }}" \
            --attach "msData.json"
