name: Setup uv environment
description: Set up Python and uv, then install development dependencies

inputs:
  python-version:
    description: Python version to install
    required: false
    default: "3.11"

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v6
      with:
        python-version: ${{ inputs.python-version }}

    - uses: astral-sh/setup-uv@v8.1.0
      with:
        enable-cache: true

    - run: uv sync --dev
      shell: bash
