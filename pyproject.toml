[project]
name = "ms-data-repo"
version = "0.1.0"
description = "Data management for msData.json with Python tooling"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
  "httpx~=0.27",
  "beautifulsoup4~=4.12",
  "lxml~=5.2",
  "jsonschema~=4.22",
  "cloudscraper~=1.2"
]

[dependency-groups]
dev = [
  "black~=24.0",
  "ruff~=0.6",
  "pytest~=8.0",
  "pytest-cov~=6.0",
]

[tool.black]
line-length = 88
target-version = ["py311"]
skip-string-normalization = true

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
# UP006/UP007/UP035/UP045: typing.Dict/Optional 等の旧式表記を dict / X | None へ統一
select = [
  "E",
  "F",
  "I",
  "W",
  "B",
  "C4",
  "SIM",
  "RUF100",
  "RUF022",
  "UP006",
  "UP007",
  "UP035",
  "UP045",
]
ignore = ["E402", "E501"]

[tool.ruff.lint.isort]
# tests/ 直下の共有ヘルパー（pytest が tests/ を sys.path に載せるため素の名前で import する）
known-local-folder = ["auto_review_helpers", "helpers", "workflow_contract"]

[tool.ruff.lint.per-file-ignores]
# CLI と後方互換 API を提供する facade の意図的な re-export。
"ms_data/gh/auto_review_merge.py" = ["F401"]
"ms_data/scraping/scrape_msdata.py" = ["F401"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.coverage.run]
source = ["ms_data"]

[tool.coverage.report]
# 自動更新 PR の CI にも適用されるため、実測値より必ず低く保つ。
# 運用: テスト追加 PR ごとに「実測 -2pt」へ引き上げる（直近実測 86.66%）
fail_under = 84.66
show_missing = true
skip_covered = true
