[project]
name = "ms-data-repo"
version = "0.1.0"
description = "Data management for msData.json with Python tooling"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "httpx~=0.27",
  "beautifulsoup4~=4.12",
  "lxml~=5.2",
  "tenacity~=8.2",
  "cloudscraper~=1.2"
]

[dependency-groups]
dev = [
  "black~=24.0",
  "ruff~=0.6",
  "pytest~=8.0",
  "pytest-cov~=6.0",
  "jsonschema~=4.22",
]

[tool.black]
line-length = 88
target-version = ["py311"]
skip-string-normalization = true

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E402", "E501", "F401", "F541", "E741", "I001"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.coverage.run]
source = ["ms_data"]

[tool.coverage.report]
# 自動更新 PR の CI にも適用されるため、実測値（62%）より低く設定する
fail_under = 73
show_missing = true
skip_covered = true
